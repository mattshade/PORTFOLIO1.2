# Build the portfolio and optionally copy pre-built projects into dist/projects/
# To include project demos: build each app in RECENT-PROJECTS (dist/ or out/), then run this build.
[build]
  command = "bash scripts/netlify-build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallbacks for hosted projects (must come before portfolio catch-all)
[[redirects]]
  from = "/projects/chatgpt-dashboard/*"
  to = "/projects/chatgpt-dashboard/index.html"
  status = 200
[[redirects]]
  from = "/projects/executive-ai-dashboard/*"
  to = "/projects/executive-ai-dashboard/index.html"
  status = 200
[[redirects]]
  from = "/projects/agentops-index/*"
  to = "/projects/agentops-index/index.html"
  status = 200
[[redirects]]
  from = "/projects/ai-adoption-crm/*"
  to = "/projects/ai-adoption-crm/index.html"
  status = 200
[[redirects]]
  from = "/projects/shadcn-blocks/*"
  to = "/projects/shadcn-blocks/index.html"
  status = 200
[[redirects]]
  from = "/projects/dev-agents-dashboard/*"
  to = "/projects/dev-agents-dashboard/index.html"
  status = 200
[[redirects]]
  from = "/projects/github-copilot-dashboard/*"
  to = "/projects/github-copilot-dashboard/index.html"
  status = 200
[[redirects]]
  from = "/projects/cfr-dashboard-bugz/*"
  to = "/projects/cfr-dashboard-bugz/index.html"
  status = 200
[[redirects]]
  from = "/projects/ai-data-hub/*"
  to = "/projects/ai-data-hub/index.html"
  status = 200

# Storybook static build (copied to dist/storybook by npm run build) — must come before SPA catch-all
[[redirects]]
  from = "/storybook"
  to = "/storybook/"
  status = 301

# Avoid long-lived CDN cache of replaced PDFs (resume download)
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Portfolio SPA fallback (catch-all)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
